services:
  - type: web
    name: studyrag-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DB_CONNECTION_STRING
        value: sqlite:///./studyrag.db

  - type: web
    name: studyrag-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Tailwind v4(@tailwindcss/vite)는 Node 20+가 필요합니다.
      # Render 기본 Node 버전이 더 낮으면 빌드 결과 CSS가 깨질 수 있어요.
      - key: NODE_VERSION
        value: 20.19.0
    routes:
      # SPA fallback: 새로고침 시 모든 경로를 index.html로 보내되,
      # 정적 자산(css/js 등)은 그대로 서빙되도록 순서를 유지합니다.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
